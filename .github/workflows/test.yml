name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - uses: actions/cache@v3
        with:
          path: |
            venv
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          playwright install

      - name: Run tests
        run: |
          source venv/bin/activate
          pytest tests/unit/ --cov=app --junitxml=test-results/junit.xml
          pytest tests/integration/
          pytest tests/e2e/

      - name: Run tests with coverage
        run: |
          source venv/bin/activate
          pytest --cov=app --cov-report=term-missing --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker compose build

      - name: Start Docker containers
        run: docker compose up -d

      - name: Wait for container to be ready
        run: |
          sleep 5
          docker compose ps

      - name: Fix volume permissions
        run: |
          docker compose exec -T web bash -c 'chown appuser:appgroup /app/.coverage* || true'
          docker compose exec -T web bash -c 'chown appuser:appgroup /app/test.db || true'

      - name: Run tests in Docker
        run: |
          docker compose exec -T web env COVERAGE_FILE=/tmp/.coverage DATABASE_URL=sqlite:////tmp/test.db pytest tests/unit/ tests/integration/ --cov=app --cov-append --cov-report=term-missing --cov-report=html:/tmp/htmlcov -v

      - name: Verify coverage files exist
        run: |
          docker compose exec -T web ls -la /app/htmlcov/ || echo "htmlcov directory not found"
          docker compose exec -T web ls -la /app/.coverage || echo ".coverage file not found"

      - name: Copy coverage report from Docker
        if: success()
        run: |
          docker compose cp web:/tmp/htmlcov ./htmlcov-docker
          docker compose cp web:/app/.coverage ./.coverage-docker

      - name: Upload Docker coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docker-coverage-report
          path: htmlcov-docker/

      - name: Stop Docker containers
        if: always()
        run: docker compose down
