<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Login</title>
    <style>
      body{font-family:Arial,sans-serif;padding:2rem}
      /* ensure message element is considered visible by tests */
      #message{min-height:1em;display:block}
    </style>
  </head>
  <body>
    <h1>Login</h1>
    <form id="loginForm">
      <label>Username: <input type="text" id="username" required></label><br>
      <label>Password: <input type="password" id="password" required></label><br>
      <button type="submit">Login</button>
    </form>
    <div id="message" role="status"></div>

    <script>
      const form = document.getElementById('loginForm');
      const msg = document.getElementById('message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.innerText = '';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
          const res = await fetch('/users/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
          });
          const data = await res.json();
          if (res.ok) {
            if (data.access_token) localStorage.setItem('access_token', data.access_token);
            msg.innerText = 'Login successful';
          } else {
            msg.innerText = data.detail || data.error || 'Login failed';
          }
        } catch (err) {
          msg.innerText = err.message || 'Network error';
        }
      });
    </script>
  </body>
</html>
