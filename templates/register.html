<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Calculator App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    #message {
      min-height: 1em;
      display: block;
      margin-top: 15px;
      padding: 12px;
      border-radius: 5px;
      text-align: center;
      font-weight: 500;
    }
    #message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    #message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }
    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }
    .login-link a:hover {
      color: #764ba2;
    }
  </style>
</head>
<body>
  <div class="navbar" style="position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;z-index:1000;">
    <h2 style="color:#667eea;font-size:20px;margin:0;">🧮 Calculator Pro</h2>
    <div style="display:flex;gap:1rem;align-items:center;">
      <a href="/register" id="registerLink">Register</a>
      <a href="/login" id="loginLink">Login</a>
      <div style="position:relative;display:inline-block;">
        <a href="/profile" id="profileLink" class="profile-icon" title="Profile" style="display:none;margin-left:6px;">
          <span class="avatar">👤</span>
          <span id="profileName" class="profile-name">User</span>
        </a>
        <div id="profileDropdown" style="display:none;position:absolute;right:0;top:44px;background:white;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);overflow:hidden;min-width:160px;z-index:2000;">
          <a id="viewProfile" href="/profile" style="display:block;padding:10px 12px;color:#333;text-decoration:none;">View profile</a>
          <button id="dropdownLogout" style="width:100%;text-align:left;padding:10px 12px;border:none;background:none;cursor:pointer;">Log out</button>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" style="display: none;">Logout</button>
    </div>
  </div>
  <div style="height:72px;"></div>
  <div class="container">
    <h1>Create Account</h1>
    <form id="registerForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" required>
      </div>
      <button type="submit">Register</button>
    </form>
    <div id="message" role="status"></div>
    <div class="login-link">
      Already have an account? <a href="/login">Login here</a>
    </div>
  </div>

  <script>
    // Navbar behavior: show/hide links and profile initial
    (function(){
      const token = localStorage.getItem('access_token');
      const registerLink = document.getElementById('registerLink');
      const loginLink = document.getElementById('loginLink');
      const logoutBtn = document.getElementById('logoutBtn');
      const profileLink = document.getElementById('profileLink');
      const profileNameEl = document.getElementById('profileName');
      const profileDropdown = document.getElementById('profileDropdown');
      const dropdownLogout = document.getElementById('dropdownLogout');

      // hide profile link by default
      profileLink.style.display = 'none';

      if (token) {
        fetch('/users/me', { headers: { 'Authorization': `Bearer ${token}` } })
          .then(r => {
            if (!r.ok) throw new Error('auth-failed');
            return r.json();
          })
          .then(user => {
            registerLink.style.display = 'none';
            loginLink.style.display = 'none';
            logoutBtn.style.display = 'inline-block';
            profileLink.style.display = 'inline-flex';
            if (user && user.username) {
              const avatarEl = document.querySelector('#profileLink .avatar');
              profileNameEl.innerText = user.username;
              avatarEl.innerText = user.username.charAt(0).toUpperCase();
            }
          })
          .catch(()=>{
            localStorage.removeItem('access_token');
            registerLink.style.display = 'inline-block';
            loginLink.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            profileLink.style.display = 'none';
          });
      } else {
        registerLink.style.display = 'inline-block';
        loginLink.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        profileLink.style.display = 'none';
      }

      logoutBtn && logoutBtn.addEventListener('click', ()=>{ localStorage.removeItem('access_token'); window.location.reload(); });
      profileLink && profileLink.addEventListener('click', (e)=>{ e.preventDefault(); profileDropdown.style.display = profileDropdown.style.display === 'block' ? 'none' : 'block'; });
      dropdownLogout && dropdownLogout.addEventListener('click', ()=>{ localStorage.removeItem('access_token'); window.location.reload(); });
      document.addEventListener('click', (e)=>{ if (!profileDropdown.contains(e.target) && e.target !== profileLink) profileDropdown.style.display='none'; });
    })();

    const form = document.getElementById('registerForm');
    const msg = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.innerText = '';
      msg.className = '';
      msg.style.display = 'block';
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (!email || !username || !password) {
        msg.innerText = 'Please fill all fields';
        msg.className = 'error';
        return;
      }
      if (password.length < 6) {
        msg.innerText = 'Password must be at least 6 characters';
        msg.className = 'error';
        return;
      }
      if (password !== confirm) {
        msg.innerText = 'Passwords do not match';
        msg.className = 'error';
        return;
      }

      try {
        const res = await fetch('/users/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, email, password})
        });
        const data = await res.json();
        if (res.ok) {
          if (data.access_token) localStorage.setItem('access_token', data.access_token);
          msg.innerText = 'Registration successful! Redirecting to login...';
          msg.className = 'success';
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          msg.innerText = data.detail || data.error || 'Registration failed';
          msg.className = 'error';
        }
      } catch (err) {
        msg.innerText = err.message || 'Network error';
        msg.className = 'error';
      }
    });
  </script>
</body>
</html>
