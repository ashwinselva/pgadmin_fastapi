<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Register</title>
    <style>
      body{font-family:Arial,sans-serif;padding:2rem}
      /* ensure message element is considered visible by tests */
      #message{min-height:1em;display:block}
    </style>
  </head>
  <body>
    <h1>Register</h1>
    <form id="registerForm">
      <label>Email: <input type="email" id="email" required></label><br>
      <label>Username: <input type="text" id="username" required></label><br>
      <label>Password: <input type="password" id="password" required></label><br>
      <label>Confirm: <input type="password" id="confirm" required></label><br>
      <button type="submit">Register</button>
    </form>
    <div id="message" role="status"></div>

    <script>
      const form = document.getElementById('registerForm');
      const msg = document.getElementById('message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.innerText = '';
        msg.style.display = 'block'; // ensure it's visible
        const email = document.getElementById('email').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (!email || !username || !password) {
          msg.innerText = 'Please fill all fields';
          return;
        }
        if (password.length < 6) {
          msg.innerText = 'Password must be at least 6 characters';
          return;
        }
        if (password !== confirm) {
          msg.innerText = 'Passwords do not match';
          return;
        }

        try {
          const res = await fetch('/users/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password})
          });
          const data = await res.json();
          if (res.ok) {
            // store token
            if (data.access_token) localStorage.setItem('access_token', data.access_token);
            msg.innerText = 'Registration successful';
          } else {
            msg.innerText = data.detail || data.error || 'Registration failed';
          }
        } catch (err) {
          msg.innerText = err.message || 'Network error';
        }
      });
    </script>
  </body>
</html>
